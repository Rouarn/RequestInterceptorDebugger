<!--
  sidepanel/sidepanel.html

  Vakao 扩展的 Side Panel（侧边栏面板）主页面。
  这是扩展的用户界面入口，包含以下核心区域：

  1. 顶部栏（Header）：品牌标识 + 操作按钮（清空请求、规则管理）
  2. Tab 切换：请求列表 / 拦截规则
  3. 请求列表面板：过滤栏 + 请求列表
  4. 规则管理面板：操作按钮 + 规则列表
  5. 请求详情弹窗：概览/请求头/请求体/响应 + 操作按钮
  6. 规则编辑弹窗：规则表单（支持 mock/modify/redirect 三种动作）

  通信方式：通过 sidepanel.js 与 background service-worker.js 通信。
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vakao - 网页请求拦截与调试工具</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <!-- 主应用容器，使用 Flexbox 纵向布局占满整个视口 -->
    <div class="app">

      <!-- ===== 顶部栏 ===== -->
      <header class="header">
        <!-- 品牌标识：SVG 图标 + 标题 -->
        <div class="header-brand">
          <!-- 层叠图标 SVG（表示网络请求的层叠关系） -->
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="brand-icon"
          >
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
          <h1>Vakao</h1>
        </div>

        <!-- 操作按钮组 -->
        <div class="header-actions">
          <!-- 清空请求按钮 -->
          <button id="clearRequests" class="btn btn-secondary" title="清空请求">
            <!-- 垃圾桶图标 SVG -->
            <svg
              viewBox="0 0 24 24"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="3 6 5 6 21 6" />
              <path
                d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
              />
            </svg>
            清空
          </button>

          <!-- 规则管理按钮（点击跳转到规则 Tab） -->
          <button id="openRules" class="btn btn-primary">
            <!-- 齿轮设置图标 SVG -->
            <svg
              viewBox="0 0 24 24"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            规则管理
          </button>
        </div>
      </header>

      <!-- ===== Tab 切换栏 ===== -->
      <div class="tabs">
        <button class="tab active" data-tab="requests">请求列表</button>
        <button class="tab" data-tab="rules">拦截规则</button>
      </div>

      <!-- ===== 请求列表面板 ===== -->
      <div id="requestsPanel" class="panel active">
        <!-- 过滤栏：URL 关键字 / HTTP 方法 / 状态码范围 -->
        <div class="filter-bar">
          <input
            type="text"
            id="filterUrl"
            placeholder="过滤 URL..."
            class="input"
          />
          <select id="filterMethod" class="select">
            <option value="">所有方法</option>
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
            <option value="PATCH">PATCH</option>
          </select>
          <select id="filterStatus" class="select">
            <option value="">所有状态</option>
            <option value="2xx">2xx</option>
            <option value="3xx">3xx</option>
            <option value="4xx">4xx</option>
            <option value="5xx">5xx</option>
          </select>
        </div>

        <!-- 请求列表容器（由 sidepanel.js 动态渲染） -->
        <div id="requestList" class="request-list">
          <!-- 空状态占位符 -->
          <div class="empty-state">
            <svg
              viewBox="0 0 24 24"
              width="32"
              height="32"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="color: var(--text-tertiary); margin-bottom: 4px"
            >
              <path
                d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9m-9 9a9 9 0 0 1 9-9"
              />
            </svg>
            暂无捕获的请求
          </div>
        </div>
      </div>

      <!-- ===== 规则管理面板 ===== -->
      <div id="rulesPanel" class="panel">
        <!-- 规则操作栏：添加规则 + 导入/导出 -->
        <div class="rules-header">
          <!-- 添加规则按钮 -->
          <button id="addRule" class="btn btn-primary">
            <!-- 加号图标 SVG -->
            <svg
              viewBox="0 0 24 24"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            添加规则
          </button>
          <div class="rules-actions">
            <!-- 导入规则按钮 -->
            <button id="importRules" class="btn btn-secondary">
              <!-- 下载图标 SVG -->
              <svg
                viewBox="0 0 24 24"
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              导入
            </button>
            <!-- 导出规则按钮 -->
            <button id="exportRules" class="btn btn-secondary">
              <!-- 上传图标 SVG -->
              <svg
                viewBox="0 0 24 24"
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
              导出
            </button>
          </div>
        </div>

        <!-- 规则列表容器（由 sidepanel.js 动态渲染） -->
        <div id="ruleList" class="rule-list">
          <!-- 空状态占位符 -->
          <div class="empty-state">
            <svg
              viewBox="0 0 24 24"
              width="32"
              height="32"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="color: var(--text-tertiary); margin-bottom: 4px"
            >
              <path d="M12 2L2 7l10 5 10-5-10-5z" />
              <path d="M2 17l10 5 10-5" />
              <path d="M2 12l10 5 10-5" />
            </svg>
            暂无拦截规则
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 请求详情弹窗 ===== -->
    <div id="requestDetail" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>请求详情</h2>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <!-- 详情内容 Tab 切换（概览/请求头/请求体/响应） -->
          <div class="detail-tabs">
            <button class="detail-tab active" data-detail-tab="overview">
              概览
            </button>
            <button class="detail-tab" data-detail-tab="headers">请求头</button>
            <button class="detail-tab" data-detail-tab="body">请求体</button>
            <button class="detail-tab" data-detail-tab="response">响应</button>
          </div>
          <!-- 详情内容容器（由 sidepanel.js 动态渲染） -->
          <div id="detailContent" class="detail-content"></div>
        </div>
        <div class="modal-footer">
          <!-- 从请求创建 Mock 规则 -->
          <button id="mockFromRequest" class="btn btn-primary">
            <svg
              viewBox="0 0 24 24"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            Mock 此请求
          </button>
          <!-- 从请求创建 Modify 规则 -->
          <button id="modifyFromRequest" class="btn btn-primary">
            <svg
              viewBox="0 0 24 24"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
              />
              <path
                d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
              />
            </svg>
            修改此请求
          </button>
          <!-- 复制为 cURL 命令 -->
          <button id="copyCurl" class="btn btn-secondary">复制 cURL</button>
          <!-- 复制响应体 -->
          <button id="copyResponse" class="btn btn-secondary">复制响应</button>
        </div>
      </div>
    </div>

    <!-- ===== 规则编辑弹窗 ===== -->
    <div id="ruleModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="ruleModalTitle">添加规则</h2>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <form id="ruleForm">
            <!-- 规则 ID（隐藏字段，用于区分新建/编辑） -->
            <input type="hidden" id="ruleId" />

            <!-- 规则名称 -->
            <div class="form-group">
              <label for="ruleName">规则名称</label>
              <input
                type="text"
                id="ruleName"
                class="input"
                required
                placeholder="例如：Mock 用户接口"
              />
            </div>

            <!-- URL 匹配模式 -->
            <div class="form-group">
              <label for="ruleUrlPattern">URL 匹配模式</label>
              <input
                type="text"
                id="ruleUrlPattern"
                class="input"
                required
                placeholder="例如：/api/user 或 https://example.com/api/*"
              />
            </div>

            <!-- 匹配类型：包含 或 正则表达式 -->
            <div class="form-group">
              <label for="ruleMatchType">匹配类型</label>
              <select id="ruleMatchType" class="select">
                <option value="contains">包含</option>
                <option value="regex">正则表达式</option>
              </select>
            </div>

            <!-- HTTP 方法多选（限制规则生效的请求方法） -->
            <div class="form-group">
              <label for="ruleMethods">HTTP 方法（可多选）</label>
              <div class="checkbox-group">
                <label
                  ><input type="checkbox" name="method" value="GET" checked />
                  GET</label
                >
                <label
                  ><input type="checkbox" name="method" value="POST" checked />
                  POST</label
                >
                <label
                  ><input type="checkbox" name="method" value="PUT" checked />
                  PUT</label
                >
                <label
                  ><input
                    type="checkbox"
                    name="method"
                    value="DELETE"
                    checked
                  />
                  DELETE</label
                >
                <label
                  ><input type="checkbox" name="method" value="PATCH" checked />
                  PATCH</label
                >
              </div>
            </div>

            <!-- 拦截动作选择 -->
            <div class="form-group">
              <label for="ruleAction">拦截动作</label>
              <select id="ruleAction" class="select">
                <option value="mock">Mock 响应</option>
                <option value="modify">修改请求</option>
                <option value="redirect">重定向</option>
              </select>
            </div>

            <!-- Mock 响应配置区域 -->
            <div id="mockSection" class="action-section">
              <div class="form-group">
                <label for="mockStatus">响应状态码</label>
                <input
                  type="number"
                  id="mockStatus"
                  class="input"
                  value="200"
                  min="100"
                  max="599"
                />
              </div>
              <div class="form-group">
                <label for="mockBody">响应体（JSON）</label>
                <textarea
                  id="mockBody"
                  class="textarea"
                  rows="6"
                  placeholder='{"code": 0, "message": "success", "data": {}}'
                ></textarea>
              </div>
              <div class="form-group">
                <label for="mockHeaders">响应头（JSON）</label>
                <textarea
                  id="mockHeaders"
                  class="textarea"
                  rows="3"
                  placeholder='{"Content-Type": "application/json"}'
                ></textarea>
              </div>
            </div>

            <!-- 修改请求配置区域（默认隐藏） -->
            <div id="modifySection" class="action-section hidden">
              <div class="form-group">
                <label for="modifyQuery">修改 Query 参数（JSON）</label>
                <textarea
                  id="modifyQuery"
                  class="textarea"
                  rows="3"
                  placeholder='{"token": "xxx", "debug": "true"}'
                ></textarea>
              </div>
              <div class="form-group">
                <label for="modifyBody">修改请求体</label>
                <textarea
                  id="modifyBody"
                  class="textarea"
                  rows="4"
                  placeholder="新的请求体内容"
                ></textarea>
              </div>
              <div class="form-group">
                <label for="customHeaders">自定义请求头（JSON）</label>
                <textarea
                  id="customHeaders"
                  class="textarea"
                  rows="3"
                  placeholder='{"Authorization": "Bearer new-token"}'
                ></textarea>
              </div>
            </div>

            <!-- 重定向配置区域（默认隐藏） -->
            <div id="redirectSection" class="action-section hidden">
              <div class="form-group">
                <label for="redirectUrl">重定向 URL</label>
                <input
                  type="text"
                  id="redirectUrl"
                  class="input"
                  placeholder="http://localhost:3000/api/user"
                />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button id="saveRule" class="btn btn-primary">保存</button>
          <button class="btn btn-secondary modal-close">取消</button>
        </div>
      </div>
    </div>

    <!-- 隐藏的文件选择器（用于导入规则 JSON 文件） -->
    <input
      type="file"
      id="importFileInput"
      accept=".json"
      style="display: none"
    />

    <!-- 加载侧边栏交互逻辑 -->
    <script src="./sidepanel.js"></script>
  </body>
</html>
